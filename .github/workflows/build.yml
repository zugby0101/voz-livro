name: Gerar executáveis
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean audiolivro.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Narra-${{ runner.os }}
          path: dist/*
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp art/Narra-Windows/Narra-Audiolivro.exe out/Narra-Audiolivro-Windows.exe
          cp art/Narra-Linux/Narra-Audiolivro out/Narra-Audiolivro-Linux
          (cd art/Narra-macOS && zip -qry ../../out/Narra-Audiolivro-macOS.zip .)
          gh release delete desktop -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create desktop out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Narra para Windows, macOS e Linux" \
            --notes "Executáveis gerados automaticamente. Precisam de internet para as vozes neurais."
