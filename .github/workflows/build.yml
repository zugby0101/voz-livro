name: Gerar executáveis
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean audiolivro.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Narra-${{ runner.os }}
          path: dist/*
  mac-app:
    # Narra.app completo (Apple Silicon + Intel), montado e testado num Mac real
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Montar Narra.app
        run: ./build-mac-from-linux.sh dist-mac && xattr -cr dist-mac/Narra.app || true
      - name: "Teste Apple Silicon: abrir o app"
        run: tests/test_mac_app.sh dist-mac/Narra.app abrir
      - name: "Teste Apple Silicon: ler DOCX, DOC e PDF"
        run: tests/test_mac_app.sh dist-mac/Narra.app ler
      - name: "Teste Apple Silicon: gerar MP3 com voz neural"
        run: tests/test_mac_app.sh dist-mac/Narra.app mp3
      - name: "Instalar Rosetta (para testar a versão Intel)"
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - name: "Teste Intel (Rosetta): abrir o app"
        run: tests/test_mac_app.sh dist-mac/Narra.app abrir x86_64
      - name: "Teste Intel (Rosetta): gerar MP3 com voz neural"
        run: tests/test_mac_app.sh dist-mac/Narra.app mp3 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Narra-macOS-app
          path: dist-mac/Narra-macOS.zip
  release:
    needs: [build, mac-app]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp art/Narra-Windows/Narra-Audiolivro.exe out/Narra-Audiolivro-Windows.exe
          cp art/Narra-Linux/Narra-Audiolivro out/Narra-Audiolivro-Linux
          cp art/Narra-macOS-app/Narra-macOS.zip out/Narra-macOS.zip
          # versões de celular foram retiradas do projeto por enquanto
          gh release delete iphone -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release delete desktop -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create desktop out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Narra para Windows, macOS e Linux" \
            --notes "Executáveis gerados automaticamente. Precisam de internet para as vozes neurais."
