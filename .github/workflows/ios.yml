name: iPhone (IPA)
on:
  workflow_dispatch:
  push:
    paths: ["ios/**", "web/**", "pwa/**", ".github/workflows/ios.yml"]
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Interface web dentro do app
        run: pip install pillow && ./ios/prepare-www.sh
      - name: Gerar projeto Xcode
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Compilar (sem assinatura)
        run: |
          cd ios
          xcodebuild -project Narra.xcodeproj -target Narra -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empacotar .ipa
        run: |
          mkdir -p Payload && cp -R ios/build/Release-iphoneos/Narra.app Payload/
          zip -qry Narra-iPhone-sem-assinatura.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Narra-iPhone
          path: Narra-iPhone-sem-assinatura.ipa
      - name: Publicar na página de Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create iphone Narra-iPhone-sem-assinatura.ipa --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Narra para iPhone (.ipa sem assinatura)" \
            --notes "Instale com Sideloadly ou AltStore usando seu Apple ID. Veja ios/LEIA-ME.md."
