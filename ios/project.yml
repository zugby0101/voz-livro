# Projeto Xcode do Narra para iPhone/iPad.
# Gere o .xcodeproj com XcodeGen:  brew install xcodegen && cd ios && xcodegen generate
name: Narra
options:
  bundleIdPrefix: app.narra
  deploymentTarget:
    iOS: "15.0"
targets:
  Narra:
    type: application
    platform: iOS
    sources:
      - path: Narra
        excludes:
          - "www/**"
      - path: Narra/www
        type: folder
        buildPhase: resources
    info:
      path: Narra/Info.plist
      properties:
        CFBundleDisplayName: Narra
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Documento
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - public.plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.narra.audiolivro
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        # Para instalar no seu iPhone, escolha seu "Team" (Apple ID) em Signing & Capabilities.
        CODE_SIGN_STYLE: Automatic
